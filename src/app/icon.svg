<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="4XL">
  <style>
    /* Tinta sobre papel. En tema oscuro se invierte para que el icono
       nunca se funda con la barra de pestanas. */
    .fondo { fill: #111111; }
    .trazo { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .fondo { fill: #ffffff; }
      .trazo { fill: #111111; }
    }
  </style>
  <rect class="fondo" width="120" height="120" rx="27"/>
  <g class="trazo" transform="translate(8,14)">
    <path d="M0 52 H104 V66 H0 Z"/>
    <path d="M66 0 H80 V78 H104 V92 H66 V20 L26 60 H6 Z"/>
  </g>
</svg>
